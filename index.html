  background: var(--info-soft); border: 1px solid color-mix(in srgb, var(--info) 22%, transparent);
  font-size: var(--text-sm); color: var(--text-secondary);
}
.sample-banner__icon { color: var(--info); flex: none; }
.sample-banner p { flex: 1; min-width: 200px; }
.sample-banner strong { color: var(--text-primary); }
.sample-banner__actions { display: flex; gap: 6px; }

.dash-top { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; }

/* The one bold element on the page: Today's Progress */
.hero-card {
  position: relative; overflow: hidden; isolation: isolate;
  display: flex; flex-direction: column; justify-content: space-between; gap: 16px;
  padding: 26px 26px 22px;
  border-radius: var(--radius-xl);
  color: #fff;
  background: var(--gradient-brand);
  box-shadow: 0 20px 40px -12px color-mix(in srgb, var(--primary-solid) 55%, transparent);
}
.hero-card__glow {
  position: absolute; z-index: -1; inset: -40% -20% auto auto; width: 70%; aspect-ratio: 1;
  background: radial-gradient(circle, rgb(255 255 255 / 0.28), transparent 62%);
  pointer-events: none;
}
.hero-card::after {
  content: ''; position: absolute; z-index: -1; inset: 0;
  background-image: radial-gradient(rgb(255 255 255 / 0.10) 1px, transparent 1px);
  background-size: 16px 16px;
  mask-image: linear-gradient(120deg, transparent 30%, #000 100%);
  -webkit-mask-image: linear-gradient(120deg, transparent 30%, #000 100%);
}
.hero-card__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.hero-card__label { font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; }
.hero-card__percent { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 4.25rem); font-weight: 750; line-height: 1; letter-spacing: -0.05em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.hero-card__percent small { font-size: 0.45em; opacity: 0.75; margin-left: 2px; letter-spacing: 0; }
.hero-card__mood {
  font-weight: 650; font-size: var(--text-sm); padding: 8px 12px; border-radius: var(--radius-full);
  background: rgb(255 255 255 / 0.16); border: 1px solid rgb(255 255 255 / 0.22);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.hero-bar { height: 10px; border-radius: 999px; background: rgb(255 255 255 / 0.2); overflow: hidden; }
.hero-bar__fill { height: 100%; border-radius: inherit; background: #fff; box-shadow: 0 0 12px rgb(255 255 255 / 0.6); transition: width 1.1s var(--ease-out); }
.hero-beats { display: flex; gap: 5px; }
.hero-beats span { flex: 1; height: 5px; border-radius: 3px; background: rgb(255 255 255 / 0.2); }
.hero-beats span.is-on { background: rgb(255 255 255 / 0.85); }
.page-enter .hero-beats span.is-on { animation: beat-in 400ms var(--ease-out) both; animation-delay: calc(300ms + var(--i) * 60ms); }
.hero-card__foot { display: flex; align-items: center; gap: 10px; font-size: var(--text-sm); font-weight: 600; opacity: 0.92; }
.hero-card__foot span { display: inline-flex; align-items: center; gap: 6px; }
.hero-card__sep { opacity: 0.5; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stat-card {
  --tone: var(--primary);
  display: flex; flex-direction: column; gap: 8px;
  padding: 16px 18px; border-radius: var(--radius-lg);
  background: linear-gradient(160deg, color-mix(in srgb, var(--tone) 7%, var(--surface)) 0%, var(--surface) 60%);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-xs);
  transition: transform var(--dur) var(--ease-out), box-shadow var(--dur);
  min-width: 0;
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.stat-card--success { --tone: var(--success); } .stat-card--primary { --tone: var(--primary); }
.stat-card--violet { --tone: var(--c-violet); } .stat-card--amber { --tone: var(--c-amber); }
.stat-card__head { display: flex; align-items: center; gap: 8px; }
.stat-card__icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, var(--surface)); flex: none; }
.stat-card__label { font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-card__value { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 750; letter-spacing: -0.04em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat-card__value small { font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; color: var(--text-tertiary); margin-left: 6px; letter-spacing: 0; }
.stat-card__sub { font-size: var(--text-xs); color: var(--text-tertiary); }
.trend { display: inline-flex; align-items: center; gap: 3px; font-size: var(--text-xs); font-weight: 700; }
.trend em { font-style: normal; font-weight: 500; color: var(--text-tertiary); margin-left: 3px; }
.trend--up { color: var(--success); } .trend--down { color: var(--danger); }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.dash-side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel--focus .task-list { margin-top: 12px; }

.inline-add {
  display: flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 12px; border-radius: var(--radius-md);
  border: 1.5px dashed var(--border-strong); background: var(--surface-2);
  transition: border-color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-fast);
}
.inline-add:focus-within { border-style: solid; border-color: var(--primary); background: var(--surface); box-shadow: var(--ring); }
.inline-add__icon { color: var(--primary); display: grid; }
.inline-add input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; }
.inline-add input::placeholder { color: var(--text-tertiary); }
.inline-add kbd { opacity: 0; transition: opacity var(--dur-fast); }
.inline-add:focus-within kbd { opacity: 1; }

.notes-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

/* ============================== Tasks page ============================== */
.view-tabs {
  display: flex; gap: 4px; padding: 4px; border-radius: var(--radius-md);
  background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-xs);
  overflow-x: auto; scrollbar-width: none; max-width: 100%;
}
.view-tabs::-webkit-scrollbar { display: none; }
.view-tab {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  height: 36px; padding: 0 12px; border-radius: var(--radius-sm);
  font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.view-tab:hover { background: var(--surface-2); color: var(--text-primary); }
.view-tab.is-active { background: var(--primary-light); color: var(--primary); }
.view-tab__count { min-width: 20px; height: 18px; padding: 0 5px; display: grid; place-items: center; border-radius: 999px; background: var(--surface-3); font-size: 11px; font-weight: 700; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.view-tab.is-active .view-tab__count { background: var(--primary-solid); color: #fff; }
.view-tab.has-alert .view-tab__count { background: var(--danger); color: #fff; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar__search {
  flex: 1 1 220px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
  border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface); color: var(--text-tertiary);
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
}
.toolbar__search:focus-within { border-color: var(--primary); box-shadow: var(--ring); }
.toolbar__search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text-primary); }
.toolbar__search--wide { flex-basis: 320px; }
.toolbar__filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toolbar__filters > * { flex: none; }
.toolbar__filters { min-width: 0; max-width: 100%; position: relative; }
.filter-select, .toolbar__search { position: relative; }
.filter-select.is-set .select { border-color: var(--primary); color: var(--primary); background-color: var(--primary-light); }

.task-group { display: flex; flex-direction: column; gap: 10px; }
.task-group + .task-group { margin-top: 10px; }
.task-group__title { display: flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: var(--text-sm); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
.task-group__count { color: var(--text-tertiary); font-weight: 600; }
.task-group__title .icon-btn { margin-left: auto; }
.tasks-content { display: flex; flex-direction: column; gap: 8px; }
.load-more { display: flex; justify-content: center; }
.hint-line { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: var(--text-xs); color: var(--text-tertiary); }

/* ============================== Notes page ============================== */
.notes-toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.view-tabs--compact { flex: none; }
.tag-filter { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tag-filter::-webkit-scrollbar { display: none; }
.tag-pill {
  flex: none; height: 30px; padding: 0 12px; border-radius: 999px;
  font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary);
  background: var(--surface); border: 1px solid var(--border); transition: all var(--dur-fast);
}
.tag-pill:hover { border-color: var(--border-strong); color: var(--text-primary); }
.tag-pill.is-active { background: var(--text-primary); color: var(--background); border-color: var(--text-primary); }
.notes-section { display: flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: var(--text-sm); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; }
.notes-grid { columns: 4 250px; column-gap: 16px; }
.notes-grid > .note-card { break-inside: avoid; margin-bottom: 16px; display: flex; }

/* ============================== Calendar ============================== */
.calendar-page { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.cal-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-xs); min-width: 0; overflow: hidden; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.cal-head__month { font-size: var(--text-2xl); font-weight: 700; letter-spacing: -0.03em; text-transform: capitalize; }
.cal-head__sub { font-size: var(--text-sm); color: var(--text-tertiary); }
.cal-head__nav { display: flex; align-items: center; gap: 4px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.cal-weekdays span { text-align: center; font-size: var(--text-xs); font-weight: 650; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-cell {
  position: relative; min-height: 96px; padding: 8px; border-radius: var(--radius-md);
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left;
  background: var(--surface-2); border: 1px solid transparent; min-width: 0;
  transition: background var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
}
.cal-cell:hover { background: var(--surface-3); }
.cal-cell.is-outside { background: transparent; color: var(--text-tertiary); }
.cal-cell.is-outside .cal-cell__titles { opacity: 0.6; }
.cal-cell__num { font-weight: 650; font-size: var(--text-sm); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal-cell.is-today .cal-cell__num { background: var(--primary-solid); color: #fff; }
.cal-cell.is-selected { border-color: var(--primary); background: var(--primary-light); box-shadow: var(--ring); }
.cal-cell.is-all-done::after { content: '✓'; position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 800; color: var(--success); }
.cal-cell__dots { display: none; gap: 3px; align-items: center; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.cal-dot.is-done { opacity: 0.35; }
.cal-more { font-size: 10px; color: var(--text-tertiary); font-weight: 600; }
.cal-cell__titles { display: flex; flex-direction: column; gap: 3px; width: 100%; min-width: 0; }
.cal-cell__titles span {
  font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 5px; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: color-mix(in srgb, var(--c) 75%, var(--text-primary));
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
}
.cal-cell__titles span.is-done { text-decoration: line-through; opacity: 0.6; }
.cal-tip { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: var(--text-xs); color: var(--text-tertiary); }

.cal-day { position: sticky; top: calc(var(--header-h) + 12px); display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 20px; box-shadow: var(--shadow-xs); scroll-margin-top: calc(var(--header-h) + 12px); }
.cal-day__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cal-day__date { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; }
.cal-day__num { grid-row: 1 / 3; font-family: var(--font-display); font-size: 3rem; font-weight: 750; line-height: 1; letter-spacing: -0.05em; color: var(--primary); font-variant-numeric: tabular-nums; }
.cal-day__dow { grid-column: 2; font-weight: 700; }
.cal-day__month { grid-column: 2; font-size: var(--text-sm); color: var(--text-tertiary); }
.cal-day__summary { font-size: var(--text-sm); color: var(--text-secondary); }

/* ============================== Analytics ============================== */
.analytics { display: flex; flex-direction: column; gap: 18px; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi {
  --tone: var(--primary);
  display: grid; grid-template-columns: auto 1fr; grid-template-areas: "icon label" "value value" "sub sub"; align-items: center; column-gap: 10px; row-gap: 6px;
  padding: 18px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-xs);
  transition: transform var(--dur) var(--ease-out), box-shadow var(--dur);
}
.kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.kpi--success { --tone: var(--success); } .kpi--violet { --tone: var(--c-violet); } .kpi--amber { --tone: var(--c-amber); }
.kpi__icon { grid-area: icon; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, var(--surface)); }
.kpi__label { grid-area: label; font-size: var(--text-sm); font-weight: 600; color: var(--text-secondary); }
.kpi__value { grid-area: value; font-family: var(--font-display); font-size: var(--text-3xl); font-weight: 750; letter-spacing: -0.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi__value small { font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; color: var(--text-tertiary); margin-left: 6px; letter-spacing: 0; }
.kpi__sub { grid-area: sub; font-size: var(--text-xs); color: var(--text-tertiary); display: flex; align-items: center; gap: 4px; }

.an-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.an-week { grid-column: span 7; }
.an-rate { grid-column: span 5; }
.an-trend { grid-column: span 7; }
.an-cats { grid-column: span 5; }
.an-days { grid-column: span 5; }
.an-heat { grid-column: span 7; }
.rate { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.rate__list { flex: 1; min-width: 180px; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.rate__list div { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.rate__list div:last-child { border-bottom: 0; padding-bottom: 0; }
.rate__list dt { color: var(--text-secondary); font-size: var(--text-sm); }
.rate__list dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.insight { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding: 12px; border-radius: var(--radius-sm); background: var(--primary-light); color: var(--text-primary); font-size: var(--text-sm); }
.insight .icon { color: var(--primary); flex: none; margin-top: 2px; }
.heat-scroll { overflow-x: auto; padding-bottom: 4px; }
.heat-legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 12px; font-size: var(--text-xs); color: var(--text-tertiary); }
.heat-legend span:first-child { margin-right: 4px; } .heat-legend span:last-child { margin-left: 4px; }

/* ============================== Categories ============================== */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.cat-card {
  position: relative; display: flex; flex-direction: column; gap: 10px;
  padding: 18px; border-radius: var(--radius-lg); cursor: pointer;
  background: linear-gradient(165deg, color-mix(in srgb, var(--c) 10%, var(--surface)) 0%, var(--surface) 55%);
  border: 1px solid var(--border); box-shadow: var(--shadow-xs);
  transition: transform var(--dur) var(--ease-out), box-shadow var(--dur), border-color var(--dur);
}
.cat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--c) 40%, var(--border)); }
.cat-card__head { display: flex; justify-content: space-between; align-items: flex-start; }
.cat-card__icon { width: 48px; height: 48px; display: grid; place-items: center; font-size: 24px; border-radius: 15px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); }
.cat-card__name { font-size: var(--text-lg); }
.cat-card__stats { display: flex; gap: 14px; font-size: var(--text-sm); color: var(--text-tertiary); }
.cat-card__stats strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }
.cat-card__pct { font-size: var(--text-xs); color: var(--text-tertiary); }
.cat-card--add { align-items: center; justify-content: center; min-height: 180px; color: var(--text-tertiary); font-weight: 600; border: 1.5px dashed var(--border-strong); background: transparent; box-shadow: none; }
.cat-card--add:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }

/* ============================== Settings ============================== */
.settings { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; align-items: start; }
.settings-nav { position: sticky; top: calc(var(--header-h) + 16px); display: flex; flex-direction: column; gap: 2px; }
.settings-nav__item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: var(--text-sm); font-weight: 600; }
.settings-nav__item:hover { background: var(--surface); color: var(--text-primary); }
.settings-main { display: flex; flex-direction: column; gap: 18px; max-width: 760px; min-width: 0; }
.settings-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); scroll-margin-top: calc(var(--header-h) + 16px); }
.settings-section__head { display: flex; gap: 14px; align-items: flex-start; padding: 20px 22px 14px; border-bottom: 1px solid var(--border); }
.settings-section__head h2 { font-size: var(--text-md); }
.settings-section__head p { font-size: var(--text-sm); color: var(--text-tertiary); }
.settings-section__icon { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 11px; color: var(--primary); background: var(--primary-light); }
.settings-section__body { padding: 8px 22px 20px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.setting-row:last-child { border-bottom: 0; }
.setting-row__text { display: flex; flex-direction: column; gap: 2px; min-width: 180px; flex: 1; }
.setting-row__label { font-weight: 600; }
.setting-row__desc { font-size: var(--text-sm); color: var(--text-tertiary); }
.setting-row__control { max-width: 100%; }
.setting-row .segmented--priority { width: auto; }
.profile-row { display: flex; align-items: center; gap: 18px; padding-top: 12px; flex-wrap: wrap; }
.profile-row__field { flex: 1; min-width: 200px; }
.reminder-list { margin-top: 10px; padding: 12px; border-radius: var(--radius-md); background: var(--surface-2); }
.reminder-list__head { display: flex; justify-content: space-between; align-items: center; font-size: var(--text-xs); font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-tertiary); margin-bottom: 6px; }
.reminder-item { display: flex; align-items: center; gap: 10px; padding: 8px 4px; font-size: var(--text-sm); color: var(--warning); }
.reminder-item__title { flex: 1; min-width: 0; color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reminder-item__time { color: var(--text-tertiary); font-size: var(--text-xs); white-space: nowrap; }
.storage-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; margin-top: 12px; border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: 600; }
.storage-status.is-ok { background: var(--success-soft); color: var(--success); }
.storage-status.is-warn { background: var(--warning-soft); color: var(--warning); }
.storage-status span:not(.storage-status__meta) { color: var(--text-primary); }
.storage-status__meta { margin-left: auto; font-weight: 500; color: var(--text-tertiary); font-family: var(--font-mono); font-size: 12px; }
.data-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.data-btn {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--radius-md); cursor: pointer; text-align: left;
  border: 1px solid var(--border); background: var(--surface); color: var(--primary);
  transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
}
.data-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
.data-btn:focus-within { box-shadow: var(--ring); }
.data-btn span { display: flex; flex-direction: column; min-width: 0; }
.data-btn strong { color: var(--text-primary); font-size: var(--text-sm); }
.data-btn small { color: var(--text-tertiary); font-size: var(--text-xs); }
.data-btn--danger { color: var(--danger); }
.data-btn--danger:hover:not(:disabled) { border-color: var(--danger); background: var(--danger-soft); }
.settings-foot { text-align: center; font-size: var(--text-xs); color: var(--text-tertiary); padding: 8px 0 20px; }

/* ============================== Responsive ============================== */
@media (max-width: 1279px) {
  .notes-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .calendar-page { grid-template-columns: minmax(0, 1fr) 320px; }
}
@media (max-width: 1100px) {
  .dash-top, .dash-grid { grid-template-columns: minmax(0, 1fr); }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .an-week, .an-rate, .an-trend, .an-cats, .an-days, .an-heat { grid-column: span 12; }
  .calendar-page { grid-template-columns: minmax(0, 1fr); }
  .cal-day { position: static; }
}
@media (min-width: 640px) and (max-width: 1100px) {
  .stat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .dash-side { display: grid; grid-template-columns: 1fr 1fr; }
  .an-rate, .an-cats { grid-column: span 6; }
  .an-days { grid-column: span 6; }
  .an-week { grid-column: span 6; }
}
@media (max-width: 860px) {
  .settings { grid-template-columns: minmax(0, 1fr); }
  .settings-nav { position: static; flex-direction: row; overflow-x: auto; scrollbar-width: none; }
  .settings-nav__item { flex: none; background: var(--surface); border: 1px solid var(--border); }
}
@media (max-width: 767px) {
  .page { gap: 18px; padding-top: 6px; }
  .page-head__title { font-size: var(--text-xl); }
  .greeting__title { font-size: 1.75rem; }
  .hero-card { padding: 22px 20px 18px; }
  .stat-grid { gap: 10px; }
  .stat-card { padding: 14px; }
  .stat-card__value { font-size: var(--text-2xl); }
  .panel { padding: 16px; border-radius: var(--radius-md); }
  .notes-row { grid-template-columns: minmax(0, 1fr); }
  .notes-grid { columns: 1; }
  .toolbar__filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
  .toolbar__filters::-webkit-scrollbar { display: none; }
  .view-tabs--compact { width: 100%; }
  .view-tabs--compact .view-tab { flex: 1; justify-content: center; }
  .cal-card { padding: 14px 10px; border-radius: var(--radius-lg); }
  .cal-head { padding-inline: 4px; }
  .cal-grid, .cal-weekdays { gap: 3px; }
  .cal-cell { min-height: 54px; padding: 4px; align-items: center; border-radius: 12px; gap: 4px; }
  .cal-cell__titles { display: none; }
  .cal-cell__dots { display: flex; }
  .cal-cell.is-all-done::after { top: 3px; right: 5px; }
  .cal-tip { display: none; }
  .kpi { padding: 14px; }
  .kpi__value { font-size: var(--text-2xl); }
  .data-actions { grid-template-columns: minmax(0, 1fr); }
  .settings-section__head, .settings-section__body { padding-inline: 16px; }
  .dash-side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) {
  .hero-card__mood { order: -1; width: 100%; text-align: center; }
  .form__grid { grid-template-columns: minmax(0, 1fr); }
  .segmented--priority .segmented__opt > span { padding: 0 6px; gap: 5px; }
  .notes-toolbar .view-tab span:not(.view-tab__count) { display: none; }
  .greeting__actions { width: 100%; }
}

/* ==========================================================================
   ANIMATIONS — every keyframe in one place. Durations live in tokens.css
   (--dur-fast 150ms, --dur 220ms, --dur-slow 320ms).
   Page-entry effects only run while .page-enter is on the page wrapper
   (added by js/main.js when you switch pages, removed after ~0.9s).
   ========================================================================== */

/* ---------- Page entrance: fade + slight rise ---------- */
.page-enter { animation: page-in 380ms var(--ease-out) both; }
@keyframes page-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- Staggered cards ---------- */
.page-enter .stagger > * { animation: rise-in 420ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 35ms + 60ms); }
.page-enter .stagger > *:nth-child(1) { --i: 0; } .page-enter .stagger > *:nth-child(2) { --i: 1; }
.page-enter .stagger > *:nth-child(3) { --i: 2; } .page-enter .stagger > *:nth-child(4) { --i: 3; }
.page-enter .stagger > *:nth-child(5) { --i: 4; } .page-enter .stagger > *:nth-child(6) { --i: 5; }
.page-enter .stagger > *:nth-child(n+7) { --i: 6; }
@keyframes rise-in { from { opacity: 0; transform: translateY(12px) scale(0.985); } to { opacity: 1; transform: none; } }

/* ---------- Charts draw in ---------- */
.page-enter .barlist__bar { animation: grow-x 800ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 50ms + 150ms); }
.page-enter .barlist__row { --i: 0; }
.page-enter .barlist__row:nth-child(2) .barlist__bar { animation-delay: 200ms; } .page-enter .barlist__row:nth-child(3) .barlist__bar { animation-delay: 250ms; }
.page-enter .barlist__row:nth-child(4) .barlist__bar { animation-delay: 300ms; } .page-enter .barlist__row:nth-child(5) .barlist__bar { animation-delay: 350ms; }
.page-enter .barlist__row:nth-child(6) .barlist__bar { animation-delay: 400ms; } .page-enter .barlist__row:nth-child(7) .barlist__bar { animation-delay: 450ms; }
@keyframes grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.page-enter .area-chart__line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s var(--ease-out) 200ms forwards; }
.page-enter .area-chart__area { animation: fade-in 900ms var(--ease-out) 500ms both; }
.page-enter .area-chart__dot { animation: pop-in 400ms var(--ease-spring) 1.2s both; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.page-enter .donut__seg { animation: fade-in 500ms var(--ease-out) both; animation-delay: calc(var(--i) * 90ms + 150ms); }
.page-enter .ring__value { animation: ring-fill 1.1s var(--ease-out) 150ms both; }
@keyframes ring-fill { from { stroke-dashoffset: var(--circ); } }
.page-enter .heatmap__col { animation: fade-in 400ms var(--ease-out) both; }

/* ---------- Calendar month change ---------- */
.cal-grid.slide-next { animation: slide-from-right 320ms var(--ease-out); }
.cal-grid.slide-prev { animation: slide-from-left 320ms var(--ease-out); }
@keyframes slide-from-right { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slide-from-left { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }

/* ---------- Task completion ---------- */
@keyframes check-pop { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
@keyframes burst { from { opacity: 0.9; transform: scale(0.6); } to { opacity: 0; transform: scale(1.7); } }
@keyframes collapse { to { height: 0; margin-top: -8px; opacity: 0; } }
@keyframes shrink-out { to { opacity: 0; transform: scale(0.94); } }

/* ---------- Modals, menus, toasts ---------- */
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes modal-out { to { opacity: 0; transform: translateY(6px) scale(0.98); } }
@keyframes sheet-in { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheet-out { to { transform: translateY(100%); } }
@keyframes drop-in { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateX(16px); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes pop-in { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }

/* ---------- Small ambient effects ---------- */
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes pulse-ring { 0% { transform: scale(0.7); opacity: 0.9; } 100% { transform: scale(1.9); opacity: 0; } }
@keyframes urgent-glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes beat-in { from { transform: scaleY(0.2); opacity: 0.3; } to { transform: none; opacity: 1; } }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } }
@keyframes ring-bell { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-12deg); } 60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); } }

.shake { animation: shake 360ms var(--ease-out); }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* ---------- Respect "reduce motion" ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

  function toast(message, { icon: ic = "check", type = "default", title: title8 = "", action = null, duration = 3800 } = {}) {

    <button type="button" class="toast__close" aria-label="Dismiss">${icon("x", { size: 14 })}</button>
  </div>`);
    let timer;

      clearTimeout(timer);
      node.classList.add("is-leaving");
      node.addEventListener("animationend", () => node.remove(), { once: true });
      setTimeout(() => node.remove(), 400);
    };
    node.querySelector(".toast__close").addEventListener("click", close);

    node.addEventListener("mouseenter", () => clearTimeout(timer));
    node.addEventListener("mouseleave", start2);
    r.appendChild(node);
    while (r.children.length > MAX) r.firstElementChild.remove();

            sub: (n.content || n.checklist.map((c) => c.text).join(", ")).slice(0, 80),
            iconHtml: icon("note", { size: 16 }),
            run: () => openNoteForm(n)
          }));
          const cats = found.categories.map((c) => ({
            kind: "category",
            title: c.name,
            sub: t("search.openCategory"),
            iconHtml: `<span>${esc(c.icon)}</span>`,
            run: () => openCategoryTasks(c.id)
          }));
          const tags = found.tags.map(({ tag, count }) => ({
            kind: "tag",
            title: `#${tag}`,
            sub: t("search.tagCount", { count }),
            iconHtml: icon("tag", { size: 16 }),
            run: () => {
              setUi({ taskView: "all", taskFilters: { ...ui.taskFilters, tag, categoryId: "", priority: "", status: "" } });
              navigate("tasks");
            }
          }));
          results = [...tasks, ...notes, ...cats, ...tags];
          activeIndex = Math.min(activeIndex, Math.max(0, results.length - 1));
          if (!results.length) {
            box.innerHTML = `<div class="search__empty"><span>\u{1F50D}</span><strong>${esc(t("search.noResults", { q }))}</strong><p>${esc(t("search.noResultsHint"))}</p></div>`;
            return;
          }
          let offset = 0;
          let html = "";
          [[t("nav.tasks"), tasks], [t("nav.notes"), notes], [t("nav.categories"), cats], [t("search.tags"), tags]].forEach(([label, list]) => {
            html += group(label, list, q, offset);
            offset += list.length;
          });
          box.innerHTML = html;
        }
        function choose(i) {
          const r = results[i];
          if (!r) return;
          if (r.kind !== "recent" && r.kind !== "action") rememberSearch(input.value);
          modal.close(true);
          setTimeout(() => r.run(), 120);
        }
        input.addEventListener("input", () => {
          activeIndex = 0;
          draw();
        });
        input.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            if (!results.length) return;
            activeIndex = (activeIndex + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
            draw();
            root2.querySelector(`#sr-${activeIndex}`)?.scrollIntoView({ block: "nearest" });
            input.setAttribute("aria-activedescendant", `sr-${activeIndex}`);
          } else if (e.key === "Enter") {
            e.preventDefault();
            const r = results[activeIndex];
            if (r?.kind === "recent") {
              input.value = r.title;
              activeIndex = 0;
              draw();
              return;
            }
            choose(activeIndex);
          }
        });
        box.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-index]");
          if (!btn) return;
          const r = results[Number(btn.dataset.index)];
          if (r?.kind === "recent") {
            input.value = r.title;
            activeIndex = 0;
            draw();
            input.focus();
            return;
          }
          choose(Number(btn.dataset.index));
        });
        draw();
      }
    });
  }
  function initSearchShortcuts() {
    document.addEventListener("keydown", (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
      if ((e.key === "k" || e.key === "K") && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        if (!isOpen) openSearch();
      } else if (e.key === "/" && !typing && !hasOpenModal()) {
        e.preventDefault();
        openSearch();
      }
    });
  }
  registerActions({ "open-search": () => openSearch() });

  // js/main.js
  var lastRenderedRoute = null;
  var frame = 0;
  function requestRender() {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      render8();
    });
  }
  function captureFocus() {
    const a = document.activeElement;
    if (!a?.id || !document.getElementById("main")?.contains(a)) return null;
    return { id: a.id, start: a.selectionStart, end: a.selectionEnd };
  }
  function restoreFocus(saved) {
    if (!saved) return;
    const node = document.getElementById(saved.id);
    if (!node) return;
    node.focus({ preventScroll: true });
    try {
      if (saved.start !== null && saved.start !== void 0) node.setSelectionRange(saved.start, saved.end);
    } catch {
    }
  }
  function render8() {
    const state2 = getState();
    const route = getRoute();
    const page = pages[route];
    const entering = route !== lastRenderedRoute;
    const main = document.getElementById("main");
    const focus = entering ? null : captureFocus();
    const scrollY = window.scrollY;
    try {
      main.innerHTML = `<div class="page page--${route} ${entering ? "page-enter" : ""}">${page.render(state2)}</div>`;
    } catch (err) {
      console.error("[render] page failed", err);
      main.innerHTML = `<div class="page"><div class="empty"><div class="empty__art"><span>\u26A0\uFE0F</span></div>
      <h3 class="empty__title">${t("error.title")}</h3><p class="empty__text">${t("error.text")}</p>
      <button type="button" class="btn btn--primary btn--md" onclick="location.reload()">${t("error.reload")}</button></div></div>`;
    }
    updateShell(route);
    setPageTitle(page.title(), "");
    page.mount?.(main, { entering, state: state2 });
    if (entering) {
      lastRenderedRoute = route;
      window.scrollTo({ top: 0 });
      setTimeout(() => main.querySelector(".page-enter")?.classList.remove("page-enter"), 900);
    } else {
      window.scrollTo({ top: scrollY });
      restoreFocus(focus);
    }
  }
  function initShortcuts() {
    document.addEventListener("keydown", (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
      if (typing || hasOpenModal() || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "n" || e.key === "N") {
        e.preventDefault();
        openTaskForm();
      }
      const jump = { 1: "dashboard", 2: "tasks", 3: "notes", 4: "calendar", 5: "analytics", 6: "categories", 7: "settings" }[e.key];
      if (jump) navigate(jump);
    });
  }
  function registerServiceWorker() {
    if (!("serviceWorker" in navigator) || window.location.protocol !== "https:" && window.location.hostname !== "localhost") return;
    navigator.serviceWorker.register("sw.js").catch(() => {
    });
  }
  async function start() {
    const state2 = await initStore();
    applyTheme(state2.settings.theme, state2.settings.accent);
    setLanguage(state2.settings.language);
    initRouter();
    initEvents();
    renderShell(document.getElementById("app"));
    render8();
    subscribe(requestRender);
    onUiChange(requestRender);
    onRouteChange(() => {
      closeDropdown();
      if (ui.sidebarOpen) setUi({ sidebarOpen: false });
      requestRender();
    });
    watchSystemTheme(requestRender);
    onInstallChange(requestRender);
    onSyncChange(requestRender);
    initSync().catch((err) => console.warn("[sync] start failed", err));
    whenReady().then(() => setTimeout(showWelcomeIfNeeded, 400));
    if (sampleWasRemoved()) setTimeout(() => toast(t("toast.sampleRemoved"), { icon: "sparkle", duration: 6e3 }), 600);
    onSaveError(() => toast(t("toast.saveFailed"), { icon: "alert", type: "error", duration: 8e3 }));
    initSwipe();
    initSearchShortcuts();
    initShortcuts();
    startReminderLoop();
    registerServiceWorker();
    let lang2 = state2.settings.language;
    subscribe((s) => {
      if (s.settings.language !== lang2) {
        lang2 = s.settings.language;
        renderShell(document.getElementById("app"));
        lastRenderedRoute = null;
        requestRender();
      }
    });
    const counts = viewCounts(state2);
    if (state2.settings.notifications.overdueAlerts && counts.overdue) {
      setTimeout(() => toast(t("toast.overdueAlert", { n: counts.overdue }), {
        icon: "alert",
        type: "warning",
        duration: 7e3,
        action: { label: t("common.view"), onClick: () => {
          setUi({ taskView: "overdue" });
          navigate("tasks");
        } }
      }), 900);
    }
  }
  start().catch((err) => {
    console.error(err);
    document.getElementById("app").innerHTML = `<div class="boot-error"><h1>Tempo couldn't start</h1><p>${String(err.message || err)}</p><button onclick="location.reload()">Reload</button></div>`;
  });
})();

</script>
</body>
</html>
